services:

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: crochet-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crochet-network
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    container_name: crochet-backend
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - crochet-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: crochet-mongodb
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
      - ./database/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - crochet-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  crochet-network:

volumes:
  mongo-data:
